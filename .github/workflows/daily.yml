name: 生物晨报每日更新
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 抓取并生成晨报
        run: python fetch_news.py
      - name: 提交更新数据
        run: |
          git config user.name "bio-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json site/index.html
          if git diff --cached --quiet; then
            echo "无新内容更新"
          else
            git commit -m "每日晨报更新 $(date +"%Y-%m-%d")"
            git push
          fi
      - name: 部署到 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4